name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Build APK using build.sh
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-apk
          path: '*.apk'
